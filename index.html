<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="game-container">
        <div class="game-content">
            <h1>Tic Tac Toe</h1>
            
            <div class="controls-panel">
                <div class="game-mode-buttons">
                    <button id="twoPlayersButton">Two Players</button>
                    <button id="vsMachineButton">vs Machine</button>
                    <button id="machineVsMachineButton">Machine vs Machine</button>
                </div>
                
                <div id="difficultySelect" style="display: none;">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
            </div>

            <div id="gameModeInfo" class="game-mode-info">Select a game mode to start</div>
            
            <div class="game-board">
                <div class="canvas-container">
                    <canvas id="gameCanvas" width="300" height="300"></canvas>
                </div>
            </div>
        </div>

        <div class="player-panel">
            <h2>Players</h2>
            <div class="add-player">
                <input type="text" id="inputName" placeholder="Enter player name">
                <button id="nameBtn">Add Player</button>
            </div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            
            <div class="scoreboard">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Won</th>
                            <th>Lost</th>
                            <th>Draw</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="winningMessage" class="winning-message">
        <div data-winning-message-text></div>
        <button id="restartButton">Play Again</button>
    </div>

    <div id="gameModeOverlay" class="game-mode-overlay">
        <div class="game-mode-selection">
            <h2>Select Game Mode</h2>
            <button id="initialTwoPlayersBtn">Two Players</button>
            <button id="initialVsMachineBtn">vs Machine</button>
            <button id="initialMachineVsMachineBtn">Machine vs Machine</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
